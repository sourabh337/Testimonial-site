<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Testimonials</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Heading Section -->
  <header class="header">
    <h2>What Our Clients Say</h2>
    <p>Real feedback from people who use our services every day.</p>
  </header>

  <main class="testimonial-container">
    <div class="card">
      <img id="person-img" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150" alt="Client photo">
      <h3 id="author">Sarah Jenkins</h3>
      <p id="job">UX Designer</p>

      <!-- Star Ratings Container -->
      <div id="stars" class="stars">★★★★★</div>

      <p id="info">
        "Working with this team was an absolute breeze. They delivered on every single promise, and our web traffic doubled within a month of launch!"
      </p>

      <div class="button-container">
        <button class="prev-btn" id="prev-btn">&#10094; Prev</button>
        <button class="next-btn" id="next-btn">Next &#10095;</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
